<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Play triangle gradient: horizontal flow L→R (direction of play) -->
    <linearGradient id="play-fill" x1="226" y1="256" x2="300" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#29F4FF"/>
    </linearGradient>

    <!-- Outer ring halo — tight, subtle -->
    <filter id="ring-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7"/>
    </filter>

    <!-- Play triangle soft glow -->
    <filter id="play-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Fond cercle — #051A21 -->
  <circle cx="256" cy="256" r="256" fill="#051A21"/>

  <!-- Anneau extérieur — halo diffus (5-10% intensity) -->
  <circle cx="256" cy="256" r="234" fill="none" stroke="#00D8FF" stroke-width="7" opacity="0.08" filter="url(#ring-glow)"/>
  <!-- Anneau extérieur — trait principal -->
  <circle cx="256" cy="256" r="234" fill="none" stroke="#00D8FF" stroke-width="2" opacity="0.90"/>

  <!-- Anneau intérieur — cyan foncé -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#007A8C" stroke-width="1.2" opacity="0.40"/>

  <!-- Cercle central — "petit cercle parfaitement aligné" -->
  <circle cx="256" cy="256" r="68" fill="none" stroke="#00D8FF" stroke-width="1.8" opacity="0.60"/>

  <!-- Play — glow layer -->
  <path d="M238 214 L238 298 L302 256 Z" fill="#00D8FF" opacity="0.10" filter="url(#play-glow)"/>
  <!-- Play — triangle principal -->
  <path d="M240 218 L240 294 L298 256 Z" fill="url(#play-fill)"/>
</svg>
