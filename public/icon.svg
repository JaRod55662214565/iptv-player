<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #0a0a14; }
      .foreground { fill: #00d9ff; }
      .accent { fill: #ff00ff; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0a0a14; }
      .foreground { fill: #00d9ff; }
      .accent { fill: #ff00ff; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="37" />
  <g transform="translate(90,90)">
    <!-- TV body -->
    <rect x="-58" y="-38" width="116" height="82" rx="12" class="foreground" fill-opacity="0.15" stroke="currentColor" stroke-width="3"/>
    <!-- Screen -->
    <rect x="-48" y="-30" width="96" height="60" rx="6" class="foreground" fill-opacity="0.05"/>
    <!-- Play triangle -->
    <polygon points="-16,-18 16,0 -16,18" class="foreground" fill="currentColor"/>
    <!-- Signal bars -->
    <rect x="18" y="-16" width="4" height="12" rx="1" fill="#ff00ff" fill-opacity="0.8"/>
    <rect x="26" y="-22" width="4" height="18" rx="1" fill="#ff00ff" fill-opacity="0.6"/>
    <rect x="34" y="-28" width="4" height="24" rx="1" fill="#ff00ff" fill-opacity="0.4"/>
    <!-- TV legs -->
    <line x1="-20" y1="44" x2="-30" y2="56" class="foreground" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="44" x2="30" y2="56" class="foreground" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <!-- Base stand -->
    <line x1="-35" y1="56" x2="35" y2="56" class="foreground" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
